# Debug APK for the Capacitor Android app (Vue app in app/ + shell in android-shell/).
# Runs on push to main when the app, shell, or this workflow change, and on workflow_dispatch.
# Publishes a 14-day Actions artifact only — no GitHub Release.
name: Android APK build

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'android-shell/**'
      - '.github/workflows/android_apk_build.yml'
  workflow_dispatch:
    inputs:
      allow_ephemeral_signing:
        description: "No DEBUG_KEYSTORE_B64 secret: build with a throw-away debug key (APK can NOT update the installed app)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # SHA-256 of the stable debug certificate (public certificate metadata, not a secret)
  EXPECTED_CERT_SHA256: b3bfc87e5a4054183c3503ed25bd926a22af2d1d9fad939895ceecf8497afee2
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: 36.0.0
  GRADLE_PROJECT: android-shell/android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            android-shell/package-lock.json

      - name: Set up Gradle (wrapper validation + cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: android-shell/android
          validate-wrappers: true
          # Allow cache writes on this repo's default branch and on trusted workflow_dispatch runs.
          cache-read-only: ${{ !(github.repository == 'RichardHan/ji-zhang' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')) }}

      - name: Install exact Android SDK packages
        run: |
          set -euo pipefail
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null

      - name: Restore stable debug keystore (fail closed)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          ALLOW_EPHEMERAL: ${{ github.event.inputs.allow_ephemeral_signing == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${DEBUG_KEYSTORE_B64}" ]; then
            umask 077
            printf '%s' "${DEBUG_KEYSTORE_B64}" | base64 -d > "$HOME/.android/debug.keystore"
            # AGP resolves the debug keystore from ANDROID_USER_HOME first; pin it so the
            # restored key is the one used (the runner image may point elsewhere).
            echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
            # Fail closed before building if the restored key is not the expected certificate.
            # Only the public certificate fingerprint is printed (standard AGP debug passwords).
            got="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
            echo "Restored keystore certificate SHA-256: ${got:-<unreadable>}"
            if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::Restored debug keystore certificate does not match EXPECTED_CERT_SHA256."
              exit 1
            fi
            echo "SIGNING_MODE=stable" >> "$GITHUB_ENV"
            echo "Using DEBUG_KEYSTORE_B64 secret (content not printed)."
          elif [ "${ALLOW_EPHEMERAL}" = "true" ]; then
            echo "SIGNING_MODE=ephemeral" >> "$GITHUB_ENV"
            echo "::warning::No DEBUG_KEYSTORE_B64 secret: APK is signed with a throw-away key and cannot update the installed app."
          else
            echo "::error::Secret DEBUG_KEYSTORE_B64 is not set. Refusing to build an APK that cannot update the installed app (re-run with allow_ephemeral_signing=true for a test-only build)."
            exit 1
          fi

      - name: Pre-fetch Gradle wrapper distribution (bounded retry, SHA-256 verified)
        # Official Gradle distribution (services.gradle.org -> GitHub release asset) can return
        # transient HTTP 504s. Fetch the exact wrapper URL with bounded retries, verify it against
        # the official published SHA-256, and place it where the wrapper looks, so ./gradlew does
        # not need to download it again. No mirrors, no version change.
        env:
          GRADLE_DIST_URL: https://services.gradle.org/distributions/gradle-8.14.3-all.zip
          GRADLE_DIST_SHA256: ed1a8d686605fd7c23bdf62c7fc7add1c5b23b2bbc3721e661934ef4a4911d7c
        working-directory: android-shell/android
        run: |
          set -euo pipefail
          props_url="$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | sed 's#\\:#:#g')"
          if [ "$props_url" != "$GRADLE_DIST_URL" ]; then
            echo "::error::gradle-wrapper.properties URL ($props_url) differs from pinned $GRADLE_DIST_URL"; exit 1
          fi
          hash="$(python3 -c 'import hashlib,os,string;h=int(hashlib.md5(os.environ["GRADLE_DIST_URL"].encode()).hexdigest(),16);d=string.digits+string.ascii_lowercase;s=""
          while h: s=d[h%36]+s; h//=36
          print(s)')"
          dir="$HOME/.gradle/wrapper/dists/gradle-8.14.3-all/$hash"
          zip="$dir/gradle-8.14.3-all.zip"
          if [ -f "$dir/gradle-8.14.3-all.zip.ok" ]; then echo "Wrapper distribution already installed (cache)."; exit 0; fi
          mkdir -p "$dir"
          for attempt in 1 2 3 4 5 6; do
            rm -f "$zip.part"
            if curl -fsSL --connect-timeout 20 --max-time 600 -o "$zip.part" "$GRADLE_DIST_URL"; then
              if echo "$GRADLE_DIST_SHA256  $zip.part" | sha256sum -c -; then
                mv "$zip.part" "$zip"; echo "Downloaded and verified on attempt $attempt."; exit 0
              fi
              echo "::warning::SHA-256 mismatch on attempt $attempt"
            fi
            [ "$attempt" -lt 6 ] && sleep $((attempt * 30))
          done
          rm -f "$zip.part"
          echo "::error::Official Gradle distribution unavailable after 6 bounded attempts"; exit 1

      - name: Test and build web app
        working-directory: app
        env:
          # Optional. Build still succeeds when unset; the app then explains that Google sign-in is not configured.
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Install JS dependencies and sync Capacitor
        working-directory: android-shell
        run: |
          set -euo pipefail
          if [ ! -d ../app/dist ]; then
            echo "::error::app/dist is missing. The web app must be built before cap sync."
            exit 1
          fi
          npm ci
          npx cap sync android

      - name: Build debug APK
        working-directory: android-shell/android
        run: >-
          ./gradlew --no-daemon :app:assembleDebug
          -Dorg.gradle.internal.repository.max.tentatives=6
          -Dorg.gradle.internal.repository.initial.backoff=5000
          -Dorg.gradle.internal.http.connectionTimeout=60000
          -Dorg.gradle.internal.http.socketTimeout=120000

      - name: Verify alignment, signature and certificate
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          APK=android-shell/android/app/build/outputs/apk/debug/app-debug.apk
          "$BT/zipalign" -c -P 16 4 "$APK"
          "$BT/apksigner" verify "$APK"
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "Signer certificate SHA-256: $CERT"
          if [ "${SIGNING_MODE}" = "stable" ] && [ "$CERT" != "${EXPECTED_CERT_SHA256}" ]; then
            echo "::error::Certificate mismatch: the keystore secret is not the key used for this project."
            exit 1
          fi
          VERSION=$("$BT/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          SIZE=$(stat -c %s "$APK")
          [ "$SIZE" -lt 104857600 ] || { echo "::error::APK is >= 100 MB"; exit 1; }
          mkdir -p dist
          SHA7="${GITHUB_SHA::7}"
          if [ "${SIGNING_MODE}" = "ephemeral" ]; then
            OUT="ji-zhang-debug-${VERSION}-${SHA7}-ephemeral.apk"
          else
            OUT="ji-zhang-debug-${VERSION}-${SHA7}.apk"
          fi
          cp "$APK" "dist/$OUT"
          ( cd dist && sha256sum "$OUT" > SHA256SUMS.txt )
          {
            echo "### APK"
            echo "- file: \`$OUT\`"
            echo "- size: $SIZE bytes"
            echo "- sha256: \`$(cut -d' ' -f1 dist/SHA256SUMS.txt)\`"
            echo "- signing: ${SIGNING_MODE} (cert $CERT)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ji-zhang-debug-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

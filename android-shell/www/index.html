<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>記帳</title>
  <style>
    :root {
      --bg: #f6f7f8;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #667085;
      --accent: #c67e48;
      --accent-dark: #a56435;
      --error: #b42318;
      --error-bg: #fef3f2;
      --border: #e4e7ec;
      --shadow: 0 10px 30px rgba(31, 31, 31, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161514;
        --card: #22211f;
        --text: #f5f3f0;
        --muted: #b0a89f;
        --accent: #d89a64;
        --accent-dark: #c67e48;
        --error: #ff8a80;
        --error-bg: #3a1d1b;
        --border: #3a3734;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 28px 24px 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      font-weight: 700;
    }
    p.lead {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
    }
    input:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }
    .hint {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
    }
    button.primary:active { background: var(--accent-dark); }
    button.secondary {
      background: transparent;
      color: var(--accent);
    }
    .error {
      display: none;
      background: var(--error-bg);
      color: var(--error);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .error.visible { display: block; }
    .redirecting { display: none; text-align: center; }
    .redirecting.visible { display: block; }
    .redirecting p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div id="redirecting" class="redirecting">
      <h1>記帳</h1>
      <p>正在連到伺服器…</p>
      <div class="actions">
        <button type="button" class="secondary" id="cancel-redirect">變更伺服器位址</button>
      </div>
    </div>
    <div id="form-wrap">
      <h1>記帳</h1>
      <p class="lead">輸入你自架的 ezBookkeeping / ji-zhang 伺服器網址。應用程式會開啟該網站的手機版頁面。</p>
      <div id="error" class="error" role="alert"></div>
      <form id="form" novalidate>
        <label for="server-url">伺服器網址</label>
        <input id="server-url" name="serverUrl" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="https://example.com 或 http://192.168.1.10:8080" required>
        <p class="hint">需為 http:// 或 https://。若服務裝在子路徑，請把路徑一起填上。</p>
        <div class="actions">
          <button type="submit" class="primary" id="open-btn">儲存並開啟</button>
          <button type="button" class="secondary" id="clear-btn" hidden>清除已儲存的網址</button>
        </div>
      </form>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
